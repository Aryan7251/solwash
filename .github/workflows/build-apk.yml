name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build SolWash Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: |
          cd frontend/android
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK file
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/SolWash-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolWash-App-Debug
          path: frontend/android/app/build/outputs/apk/debug/SolWash-v1.0.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: SolWash Android App v1.0.0
          draft: false
          prerelease: false
          body: |
            ## 📱 SolWash Android App v1.0.0

            Direct download link for Android devices:
            - **Connected Backend API:** `https://solwash-hpnn.onrender.com/api`
            - **Admin Console:** `https://solwash-hpnn.onrender.com/admin`
            - **Package Name:** `com.solwash.app`
          files: frontend/android/app/build/outputs/apk/debug/SolWash-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
